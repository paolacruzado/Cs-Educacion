<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Malla Curricular Carrera Ciencias de la Educación</title>
  <style>
    body {
      font-family: 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
      background-color: #f4f6fa;
      color: #333;
      padding: 20 px;
      margin: 0;
    }

    h1, h2 {
      color: #0a2e57;
      text-align: center;
    }

    .materia {
      background-color: #205081;
      color: white;
      border-radius: 10 px;
      padding: 12 px 16 px;
      margin: 10 px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: background-color 0.3 s ease;
      flex-wrap: wrap;
    }

    .materia.habilitada {
      background-color: #3b83bd;
      font-weight: bold;
    }

    .materia.aprobada {
      text-decoration: line-through;
      opacity: 0.6;
    }

    input[type="checkbox"] {
      transform: scale (1.2);
      margin-left: 10 px;
    }

    @media (max-width: 600 px) {
      .materia {
        flex-direction: column;
        align-items: flex-start;
      }

      input[type="checkbox"] {
        align-self: flex-end;
        margin-top: 8 px;
      }
    }
  </style>
</head>
<body>
  <h1>Malla Curricular Carrera Ciencias de la Educación</h1>
  <div id="contenedor-materias"></div>

  <script>
    // ... El contenido del script se mantiene igual ...

    const materias = [...]; // aquí iría tu array de materias completo

    const aprobadas = new Set();
    const contenedor = document.getElementById('contenedor-materias');

    function render() {
      contenedor.innerHTML = '';
      for (let s = 1; s <= 6; s++) {
        const h2 = document.createElement('h2');
        h2.textContent = `Semestre ${s}`;
        contenedor.appendChild(h2);

        materias.filter(m => m.semestre === s).forEach(mat => {
          const div = document.createElement('div');
          div.classList.add('materia');

          const label = document.createElement('label');
          label.textContent = mat.nombre;

          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = aprobadas.has(mat.id);

          checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
              aprobadas.add(mat.id);
            } else {
              aprobadas.delete(mat.id);
            }
            render();
          });

          let requisitos = mat.prereq;
          if (typeof requisitos === 'function') {
            requisitos = requisitos(materias);
          }

          const habilitada = requisitos.every(pr => aprobadas.has(pr));
          if (aprobadas.has(mat.id)) div.classList.add('aprobada');
          else if (habilitada) div.classList.add('habilitada');

          div.appendChild(label);
          div.appendChild(checkbox);
          contenedor.appendChild(div);
        });
      }
    }

    render();
  </script>
</body>
</html>
